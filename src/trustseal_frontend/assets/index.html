<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 TrustSeal Hedera - Decentralized Credential Verification</title>
    <meta name="description" content="TrustSeal Hedera - Decentralized credential verification system built on Hedera Hashgraph. Secure, instant, and cost-effective verification of educational and professional credentials.">
    <meta name="keywords" content="hedera, hashgraph, credentials, verification, NFT, distributed ledger, education, blockchain">
    <meta name="author" content="TrustSeal Team">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="TrustSeal Hedera - Credential Verification">
    <meta property="og:description" content="Decentralized credential verification on Hedera Hashgraph">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://testnet.mirrornode.hedera.com">
    
    <style>
        /* Loading screen styles */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            z-index: 9999;
        }
        
        .loading-logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .loading-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .loading-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-status {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-logo">🔐</div>
        <div class="loading-title">TrustSeal Hedera</div>
        <div class="loading-subtitle">Decentralized Credential Verification</div>
        <div class="loading-spinner"></div>
        <div class="loading-status">Connecting to Hedera Network...</div>
    </div>
    
    <!-- React Root -->
    <div id="root"></div>
    
    <script>
        // Hide loading screen when React app loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 0.5s ease-out';
                    setTimeout(function() {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            }, 1000);
        });
        
        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('TrustSeal Error:', e.error);
        });
        
        // Environment info for debugging
        console.log('🔐 TrustSeal Hedera');
        console.log('🌐 Network:', 'testnet');
        console.log('🏗️  Build:', 'development');
    </script>
</body>
</html>
